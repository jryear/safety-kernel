[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-kernel"
version = "0.0.1"
description = "Failure-first safety kernel for robot deployments"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
